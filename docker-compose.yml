services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: possync
      POSTGRES_PASSWORD: possync
      POSTGRES_DB: possync
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U possync -d possync"]
      interval: 2s
      timeout: 3s
      retries: 30

