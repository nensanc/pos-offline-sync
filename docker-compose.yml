services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: possync
      POSTGRES_PASSWORD: possync
      POSTGRES_DB: possync
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U possync -d possync"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-command demo: `docker compose run --rm demo`
  demo:
    build: .
    environment:
      DATABASE_URL: postgresql://possync:possync@db:5432/possync
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "possync.demo"]

